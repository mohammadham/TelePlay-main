name: Android Release

on:
  push:
    tags: [ "v*" ]
    branches: [ "master", "feature/music-platform", "feature/video-platform" ]
    paths: [ "android/**", ".github/workflows/android-release.yml" ]
  pull_request:
    branches: [ "master", "feature/music-platform", "feature/video-platform" ]
    paths: [ "android/**" ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: false
        default: "feature/music-platform"

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
        working-directory: ./android

      - name: Decode Keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-release-key.jks
            echo "Keystore decoded"
          else
            echo "No keystore secret — will build unsigned release (or debug fallback)"
          fi
        working-directory: ./android

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ./my-release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "my-release-key.jks" ]; then
            ./gradlew assembleRelease
          else
            echo "No keystore — building unsigned release (assembleRelease still works if signing not required, else fallback to debug)"
            ./gradlew assembleRelease || ./gradlew assembleDebug
          fi
        working-directory: ./android

      - name: List Build Outputs
        if: always()
        run: |
          echo "PWD: $(pwd)"
          ls -R app/build 2>&1 | head -100 || echo "app/build not found"
          find app/build/outputs -type f 2>&1 | head -50 || echo "No outputs found"
        working-directory: ./android

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
