name: Backend CI

on:
  push:
    branches: [ "master", "feature/music-platform", "feature/video-platform" ]
    paths: [ "backend/**", "docker-compose.yml", ".github/workflows/backend-ci.yml" ]
  pull_request:
    branches: [ "master", "feature/music-platform", "feature/video-platform" ]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: telegram_tv }
        ports: [ "5432:5432" ]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: --health-cmd "redis-cli ping" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip", cache-dependency-path: backend/requirements.txt }
      - name: Install deps
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Check syntax
        run: python -m py_compile app/main.py app/models.py app/cache_manager.py
        working-directory: backend
      - name: Check routers syntax
        run: python -m py_compile app/routers/admin.py app/routers/auth.py app/routers/files.py app/routers/folders.py app/routers/streaming.py app/routers/tv.py
        working-directory: backend
      - name: Check optional routers
        run: |
          for f in app/routers/music.py app/routers/video.py app/routers/ads.py; do
            [ -f "$f" ] && python -m py_compile "$f" || echo "skip $f"
          done
        working-directory: backend
      - name: Docker build test
        run: docker compose config || docker-compose config
