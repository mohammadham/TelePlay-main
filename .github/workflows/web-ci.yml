name: Frontend CI

on:
  push:
    branches: [ "master", "feature/music-platform", "feature/video-platform" ]
    paths: [ "web/**", "docker-compose.yml", ".github/workflows/web-ci.yml" ]
  pull_request:
    branches: [ "master", "feature/music-platform", "feature/video-platform" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Run tests
        run: npm test -- --reporter=verbose
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web